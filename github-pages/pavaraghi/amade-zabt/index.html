<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>آماده ضبط | مشکی‌مدیا</title><meta name="description" content="فهرست پاورقی‌های تأییدشده برای ضبط یوتیوب مشکی‌مدیا"><style>body{margin:0;background:#101114;color:#f7f5f1;font:16px/1.9 system-ui,Tahoma,sans-serif}main{max-width:980px;margin:0 auto;padding:32px 20px}a{color:#e9bf81}h1{font-size:clamp(1.7rem,4vw,2.6rem);margin:8px 0}header{border-bottom:1px solid #383838;padding-bottom:20px;margin-bottom:28px}.muted{color:#bbb}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.controls input,.controls select{font:inherit;border-radius:10px;padding:10px 12px;background:#22252a;color:white;border:1px solid #555}.card{border:1px solid #444;border-radius:16px;padding:16px;margin:12px 0;background:#1c1e22}.card[hidden]{display:none}.card label{float:left}button{font:inherit}small{color:#bbb} .empty{padding:24px;border:1px dashed #777;border-radius:14px}</style></head><body><main><header><a href="../">← آرشیو پاورقی</a><h1>فهرست آماده ضبط</h1><p class="muted">فقط پاورقی‌های تأییدشدهٔ نهایی نمایش داده می‌شوند. تا زمان انتشار نسخه‌های تأییدشده، فهرست خالی است.</p></header><div id="count" aria-live="polite">در حال بررسی…</div><div class="controls"><input id="search" type="search" placeholder="جستجوی سریال یا تیتر" aria-label="جستجو"><select id="kind" aria-label="نوع پاورقی"><option value="">همه</option><option value="original">ارجینال</option><option value="dubbed">فارسی</option></select><label><input id="hide" type="checkbox"> پنهان‌کردن ضبط‌شده‌ها</label></div><div id="list"></div><p class="muted"><small>علامت‌های ضبط‌شده فقط در مرورگر همین دستگاه ذخیره می‌شوند.</small></p></main><script>
(async function(){
const base="../../data/dubbed.json",list=document.getElementById("list"),count=document.getElementById("count"),search=document.getElementById("search"),kind=document.getElementById("kind"),hide=document.getElementById("hide");
const key="meshkimedia-recorded-v1";let checked={};try{checked=JSON.parse(localStorage.getItem(key)||"{}")}catch{}
const escape=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items=[];try{const response=await fetch(base,{cache:"no-store"});if(!response.ok)throw Error(response.status);const data=await response.json();items=(data.series||[]).flatMap(s=>(s.entries||[]).filter(e=>e.status==="published"&&e.editorialQuality==="youtube-ready"&&Array.isArray(e.paragraphs)&&e.paragraphs.some(p=>p&&p.trim())).map(e=>({key:s.slug+"/"+e.slug,series:s.titleFa,kind:e.kind,ep:e.originalEpisode,part:e.part||e.persianEpisode||"",title:e.editorialTitle||e.title||"",url:"../"+encodeURIComponent(s.slug)+"/"+encodeURIComponent(e.slug)+"/"})));}catch(e){count.textContent="دریافت داده‌ها ناموفق بود؛ صفحه را دوباره بارگذاری کنید.";return}
function render(){const filtered=items.filter(x=>(!search.value||(x.series+" "+x.title).includes(search.value.trim()))&&(!kind.value||x.kind===kind.value)&&(!hide.checked||!checked[x.key]));count.textContent=items.length+" آماده ضبط · "+items.filter(x=>checked[x.key]).length+" ضبط‌شده · "+filtered.length+" در فهرست";list.innerHTML=filtered.length?filtered.map(x=>'<article class="card"><label><input type="checkbox" data-key="'+escape(x.key)+'" '+(checked[x.key]?"checked":"")+'> ضبط شده</label><strong>'+escape(x.series)+'</strong><div>'+escape(x.title)+'</div><small>'+(x.kind==="original"?"ارجینال، قسمت "+escape(x.ep):"فارسی، بخش "+escape(x.part))+'</small> · <a href="'+escape(x.url)+'">مشاهده متن ←</a></article>').join(""):'<p class="empty">'+(items.length?"موردی با این فیلتر پیدا نشد.":"هنوز پاورقی تأیید نهایی‌شده‌ای برای ضبط وجود ندارد. به محض تأیید متن، اینجا ظاهر می‌شود.")+'</p>';list.querySelectorAll("input[data-key]").forEach(el=>el.addEventListener("change",()=>{checked[el.dataset.key]=el.checked;try{localStorage.setItem(key,JSON.stringify(checked))}catch{}render()}))}
[search,kind,hide].forEach(el=>el.addEventListener(el===search?"input":"change",render));render()
})();
</script></body></html>

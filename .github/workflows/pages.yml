name: Publish Meshki Media to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - "automation/build-pages-data.mjs"
      - "automation/tiak-daily.mjs"
      - "automation/build-site.mjs"
      - "automation/audit-pavaraghi.mjs"
      - "automation/social-rating-cards.py"
      - "automation/social-content.py"
      - "automation/solar_date.py"
      - "automation/social-episode-galleries.py"
      - "automation/build-social-ratings.mjs"
      - "automation/reviewed-social-ratings.json"
      - "automation/audit-cast.mjs"
      - "automation/news-collect.mjs"
      - "automation/news-bios.mjs"
      - "automation/news-sources.json"
      - ".github/workflows/pages.yml"
  schedule:
    # Hourly: fetch fresh news + actor bios + media backfill and post new stories to Telegram every hour (at :17).
    # The build is incremental (cached DB, per-run AI budget) and the concurrency group below prevents overlap.
    - cron: "17 * * * *"
    # A denser TİAK ratings sweep late morning Tehran, when official reports land.
    - cron: "5,35 7-9 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed ratings window back to main
  pages: write
  id-token: write

# One run at a time, and never cancel one halfway: it may be deploying or
# committing ratings.json. Newer queued runs simply wait their turn.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh official ratings
        id: refresh
        run: node automation/build-pages-data.mjs
        continue-on-error: true
      # Adds calendar broadcasts to series.json (continuous episode numbers) for this build.
      - name: Sync episodes from the calendar
        id: episodes
        run: node automation/sync-episodes.mjs
      # News from Turkish entertainment RSS feeds and actor bios from Wikipedia. Both need the
      # network and may fail (a dead feed, a rate limit); that never blocks publishing the site.
      # AI_API_KEY (optional repository secret) adds Persian titles/summaries; without it the
      # news still appears, in Turkish.
      - name: Collect news
        id: news
        run: node automation/news-collect.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        continue-on-error: true
      - name: Fetch actor bios from Wikipedia
        id: bios
        run: node automation/news-bios.mjs --limit=60
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        continue-on-error: true
      - name: Audit pavaraghi coverage and register episode gaps
        run: node automation/audit-pavaraghi.mjs
      - name: Regenerate static pages from data
        run: node automation/build-site.mjs
      # Posts each new story (photo + title + summary + link) to the Telegram channel.
      # Needs the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT secrets; without them it does nothing.
      - name: Post new stories to Telegram
        id: telegram
        run: node automation/news-telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        continue-on-error: true
      - name: Publish reviewed Instagram rating supplement
        run: node automation/build-social-ratings.mjs
      - name: Create daily social rating cards
        run: |
          python3 -m pip install --break-system-packages Pillow CairoSVG
          python3 automation/social-rating-cards.py
      - name: Create episode gallery carousels
        run: python3 automation/social-episode-galleries.py
      - name: Create social publication room
        run: python3 automation/social-content.py
      - name: Check editorial content
        run: node automation/audit-content.mjs --require ask-ve-taht --require sevdan-bir-ates --require abi --require gunesin-dogdugu-yer --require mercan-kosk
      - name: Check cast connections
        run: node automation/audit-cast.mjs
      # Report only: lists Top 10 programs that no series claims yet.
      - name: Report Top 10 programs missing from the site
        run: node automation/untracked-ratings.mjs
        continue-on-error: true
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      # Without this step every run starts again from the committed ratings.json, so
      # the ratings history never grows and a failed TİAK fetch rolls the site back.
      # It runs after deploy (and even if deploy failed) so publishing is never
      # blocked by it; if the push fails, the run turns red.
      - name: Persist ratings window to main
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        run: |
          file=github-pages/data/ratings.json
          # Skip when nothing but the updatedAt timestamp moved.
          if node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            const content = (s) => { const { updatedAt, ...rest } = JSON.parse(s); return JSON.stringify(rest); };
            const now = content(fs.readFileSync(process.argv[1], "utf8"));
            const committed = content(execSync("git show HEAD:" + process.argv[1], { encoding: "utf8" }));
            process.exit(now === committed ? 0 : 1);
          ' "$file"; then
            echo "Ratings window unchanged; nothing to persist."
            exit 0
          fi
          latest=$(node -p "require('./$file').days[0].date")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "data: TİAK ratings through ${latest} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Persisted ratings window (latest day ${latest})."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not push ratings.json to main"
          exit 1
      # Same idea for episodes: without this, a synced broadcast disappears again once
      # its date leaves the two-week calendar window.
      - name: Persist synced episodes to main
        if: ${{ !cancelled() && steps.episodes.outcome == 'success' }}
        run: |
          file=github-pages/data/series.json
          if git diff --quiet HEAD -- "$file"; then
            echo "Episodes unchanged; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "data: sync episodes from the Dizilah calendar [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Persisted synced episodes."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not push series.json to main"
          exit 1
      # News and bios accumulate over time (the news archive keeps 45 days, bios are fetched
      # 60 at a time), so they are committed back like ratings and episodes.
      - name: Persist news and bios to main
        if: ${{ !cancelled() && (steps.news.outcome == 'success' || steps.bios.outcome == 'success') }}
        run: |
          files="github-pages/data/news.json github-pages/data/bios.json github-pages/data/telegram-posted.json"
          if git diff --quiet HEAD -- $files; then
            echo "News and bios unchanged; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "data: news and actor bios [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Persisted news and bios."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not push news.json and bios.json to main"
          exit 1

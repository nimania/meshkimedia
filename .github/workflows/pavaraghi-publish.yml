name: Publish updated Pavaraghi pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'github-pages/data/dubbed.json'
      - 'github-pages/data/series.json'
      - 'automation/telegram-series.json'
      - 'automation/build-site.mjs'
      - '.github/workflows/pavaraghi-publish.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Pavaraghi coverage from the current catalog
        run: node automation/audit-pavaraghi.mjs
      - name: Generate static pages from current catalog
        run: node automation/build-site.mjs
      - name: Verify generated Pavaraghi articles against the current catalog
        run: |
          python - <<'PYVERIFY'
          import json
          from html import escape
          from pathlib import Path
          root = Path('github-pages')
          catalog = json.loads((root / 'data/dubbed.json').read_text(encoding='utf-8'))
          count = 0
          for series in catalog['series']:
              for entry in series.get('entries', []):
                  if entry.get('status') != 'published' or not entry.get('paragraphs'):
                      continue
                  page = root / 'pavaraghi' / series['slug'] / entry['slug'] / 'index.html'
                  assert page.is_file(), f'Missing generated article: {page}'
                  rendered = page.read_text(encoding='utf-8')
                  for paragraph in entry['paragraphs']:
                      encoded = escape(paragraph, quote=False).replace(chr(34), '&quot;')
                      assert encoded in rendered, f'Stale or incomplete article: {page}'
                  count += 1
          print(f'Verified {count} published articles against their current source text')
          PYVERIFY
      # The catalog is versioned before this run. Publish its verified build directly;
      # generated HTML does not need a second source commit to be deployable.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy generated pages
        id: deployment
        uses: actions/deploy-pages@v4
